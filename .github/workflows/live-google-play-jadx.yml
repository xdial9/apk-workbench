name: Live Google Play APK and JADX smoke test

on:
  push:
    branches:
      - feat/anonymous-google-play-session

permissions:
  contents: read

jobs:
  live-play-jadx:
    name: Live Play acquisition and real decompilers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create isolated workbench and token-cache directories
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/apk-workbench-live-smoke"
          mkdir -p "$RUNNER_TEMP/apk-workbench-config"
          mkdir -p "$RUNNER_TEMP/apk-workbench-state"
          mkdir -p "$RUNNER_TEMP/goopdl-cache"
          {
            echo "APKWORKBENCH_WORKSPACE=$RUNNER_TEMP/apk-workbench-live-smoke"
            echo "APKWORKBENCH_CONFIG_DIR=$RUNNER_TEMP/apk-workbench-config"
            echo "APKWORKBENCH_STATE_DIR=$RUNNER_TEMP/apk-workbench-state"
            echo "GOOPDL_CONFIG_DIR=$RUNNER_TEMP/goopdl-cache"
            echo "APKTOOL_JAR=$RUNNER_TEMP/apktool_3.0.3.jar"
          } >> "$GITHUB_ENV"

      - name: Install pinned JADX and Apktool binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/jadx" "$RUNNER_TEMP/bin"

          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            --output "$RUNNER_TEMP/jadx-1.5.6.zip"
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  $RUNNER_TEMP/jadx-1.5.6.zip" \
            | sha256sum --check -
          unzip -q "$RUNNER_TEMP/jadx-1.5.6.zip" -d "$RUNNER_TEMP/jadx"

          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            --output "$RUNNER_TEMP/apktool_3.0.3.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/apktool_3.0.3.jar" \
            | sha256sum --check -

          cat > "$RUNNER_TEMP/bin/apktool" <<'EOF'
          #!/usr/bin/env bash
          exec java -Duser.language=en -jar "${APKTOOL_JAR:?APKTOOL_JAR is not configured}" "$@"
          EOF
          chmod 0755 "$RUNNER_TEMP/bin/apktool"
          {
            echo "$RUNNER_TEMP/jadx/bin"
            echo "$RUNNER_TEMP/bin"
          } >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/jadx/bin:$RUNNER_TEMP/bin:$PATH"

          java -version
          jadx --version
          apktool --version

      - name: Install APK Workbench and pinned Play clients
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -c "import goopdl, playstore_cli; print('goopdl and playstore-cli imports: OK')"
          apkworkbench --version

      - name: Acquire a known Play-deliverable app and verify its bundle
        id: acquire
        shell: bash
        run: |
          set -Eeuo pipefail
          selected_package=""
          run_id=""

          for package_id in com.roleplai.app app.bitbear.tav; do
            log_file="$RUNNER_TEMP/play-download-$package_id.log"
            echo "Attempting exact package acquisition: $package_id"
            command_status=0
            apkworkbench download --package "$package_id" > "$log_file" 2>&1 || command_status=$?
            cat "$log_file"

            if [[ "$command_status" -eq 0 ]]; then
              run_id="$(awk '/^Run ID: / { sub(/^Run ID: /, ""); print; exit }' "$log_file")"
              if [[ ! "$run_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
                echo "Download returned success without a valid run ID." >&2
                exit 1
              fi
              selected_package="$package_id"
              break
            fi

            if grep -Eiq 'no downloadable delivery|no Google Play listing|cannot deliver this app' "$log_file"; then
              echo "This recorded package is currently unavailable to the selected Play device; trying the second recorded package."
              continue
            fi

            echo "Google Play acquisition failed for $package_id with exit status $command_status." >&2
            exit "$command_status"
          done

          if [[ -z "$run_id" ]]; then
            echo "Neither previously recorded downloadable package could be acquired." >&2
            exit 1
          fi

          echo "package_id=$selected_package" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Acquisition produced run $run_id for $selected_package."

      - name: Run JADX and Apktool against one real acquired APK
        shell: bash
        env:
          APKWB_RUN_ID: ${{ steps.acquire.outputs.run_id }}
          APKWB_PACKAGE_ID: ${{ steps.acquire.outputs.package_id }}
        run: |
          set -Eeuo pipefail
          test -n "$APKWB_RUN_ID"
          test -n "$APKWB_PACKAGE_ID"
          apkworkbench decompile --run-id "$APKWB_RUN_ID" --limit 1 2>&1 | tee "$RUNNER_TEMP/decompile.log"

          grep -Eq 'Examined:[[:space:]]+1' "$RUNNER_TEMP/decompile.log"
          grep -Eq 'Completed:[[:space:]]+1' "$RUNNER_TEMP/decompile.log"
          grep -Eq 'Failed:[[:space:]]+0' "$RUNNER_TEMP/decompile.log"

          result_root="$APKWORKBENCH_WORKSPACE/results/$APKWB_PACKAGE_ID"
          jadx_dir="$(find "$result_root" -type d -name jadx -print -quit)"
          apktool_dir="$(find "$result_root" -type d -name apktool -print -quit)"
          test -n "$jadx_dir"
          test -n "$apktool_dir"
          find "$jadx_dir" -type f -print -quit | grep -q .
          find "$apktool_dir" -type f -print -quit | grep -q .
          test -s "$(dirname "$jadx_dir")/jadx.log"
          test -s "$(dirname "$apktool_dir")/apktool.log"

          echo "LIVE SMOKE TEST PASSED"
          echo "Google Play supplied a real APK bundle and Workbench verified its bytes."
          echo "JADX and Apktool both ran as real external binaries and published non-empty outputs."
          echo "JADX output: $jadx_dir"
          echo "Apktool output: $apktool_dir"

      - name: Upload sanitized smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-play-jadx-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/play-download-*.log
            ${{ runner.temp }}/decompile.log
            ${{ runner.temp }}/apk-workbench-live-smoke/results/
            ${{ runner.temp }}/apk-workbench-live-smoke/database/run_manifests/
          if-no-files-found: ignore
          retention-days: 7
